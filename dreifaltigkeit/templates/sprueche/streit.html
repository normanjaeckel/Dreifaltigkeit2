<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalabel=no" />
    <title>Ein Wort zum Streit</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .quote {
            font-size: 1.5rem;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #1a1a1a;
        }
        .source {
            font-size: 1rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="quote" id="quote-text">Lade Spruch...</div>
    <div class="source" id="quote-source"></div>
</div>

<script>
    const quotes = [
        { text: "Vergeltet Böses nicht mit Bösem", source: "Röm 12,17 LU17" },
        { text: "Seid alle miteinander auf Einigkeit aus. Werdet nicht überheblich, sondern lasst euch auf die Unbedeutenden ein.", source: "Röm 12,16 BB" },
        { text: "Jagt dem Frieden nach.", source: "Hebr 12,14 LU17" },
        { text: "Er hat eine Grube gegraben und ausgehöhlt – und ist in die Grube gefallen, die er gemacht hat.", source: "Ps 7,16 LU17" },
        { text: "Ich gebe euch ein neues Gebot: Liebt einander! Genauso wie ich euch geliebt habe.", source: "Joh 13,34 BB" },
        { text: "Du siehst den Splitter im Auge deines Gegenübers. Bemerkst du nicht den Balken in deinem eigenen Auge?", source: "Mt 7,3 BB" },
        { text: "Dagegen sollen wir uns an die Wahrheit halten und uns von der Liebe leiten lassen.", source: "nach Eph 4,15" },
        { text: "Wer von euch ohne Schuld ist, werfe den ersten Stein!", source: "Joh 8,7 BB" },
        { text: "Ein Geduldiger ist besser als ein Starker und wer sich selbst beherrscht, besser als einer, der Städte einnimmt.", source: "Spr 16,32 LU17" },
        { text: "Meinst du, dass du mit Recht zürnst?", source: "Jona 4,4 LU17" }
    ];

    function getRandomQuote() {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        const selected = quotes[randomIndex];

        document.getElementById('quote-text').innerText = `„${selected.text}“`;
        document.getElementById('quote-source').innerText = selected.source;
    }

    // Beim ersten Laden direkt einen Spruch anzeigen
    window.onload = getRandomQuote;
</script>

</body>
</html>
